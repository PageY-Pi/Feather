[package]
name = "feather-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "feather-gui"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
feather = { path = "../feather" }
feather-core = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "accesskit", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
getrandom = "0.2"
# Read-only font mappings: file-backed pages are reclaimable, unlike the heap
# copies they replace. Already in the tree via winit's Linux backends.
memmap2 = "0.9"
raw-window-handle = "0.6"
winit = "0.30"
egui-winit = "0.29"
softbuffer = { version = "0.4", default-features = false }
accesskit_winit = "0.22.4"

# OpenGL remains available off Windows only.
# Windows feature graph excludes eframe's default `glow` path. Other Windows
# dependencies may import opengl32.dll, but no WGL context/ICD is initialized.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
[target.'cfg(windows)'.dependencies]
# eframe/egui-wgpu disable wgpu defaults; without this feature DX12 was NOT
# compiled, despite asking for Backends::DX12 at runtime. Avoid Windows WGL.
wgpu = { version = "22.1", default-features = false, features = ["dx12", "wgsl"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
